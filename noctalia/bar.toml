[bar]
order = [ "Top", "Bottom" ]

# Top Bar
[bar.Top]

thickness = 40
compositor_blur = false
margin_ends = 10

start = [ "weather", "mwspacer", "media", "audio_visualizer" ]
center = [ "time", "date" ]
end = [
    "network",
    "battery",
]

# Bottom Bar
[bar.Bottom]

capsule = true
thickness = 40
concave_edge_corners = false
compositor_blur = false
enabled = true
margin_ends = 10
position = "bottom"
show_on_workspace_switch = false

start = [ "taskbar" ]
center = [ ]
end = [
    "tray",
    "notifications",
    "clipboard",
    "caffeine",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "session"
]

# Widgets

[widget.audio_visualizer]
mirrored = false
width = 100

[widget.control-center]
glyph = "adjustments"

[widget.mwspacer]
type = "spacer"
length = 10

[widget.date]
type = "clock"
format = "{:%A, %e %b %Y}"

[widget.time]
type = "clock"
format = "{:%H:%M}"

[widget.media]
art_size = 30
artist_first = true
show_progress = true
rotate_album_art = true

[widget.taskbar]
group_by_workspace = true
workspace_group_content = "icons"
group_single_icon_per_app = true
workspace_label_placement = "centered"
icon_scale = 1.1